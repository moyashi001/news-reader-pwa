<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ニュース</title>
<meta name="description" content="RSS/JSON Feed/ニュースAPIから記事を集めて読めるPWA">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#FAFAF9">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div id="app">

  <div class="status-banner" id="status-banner"></div>

  <!-- ニュース一覧 -->
  <section class="view" id="view-news">
    <header class="page-header">
      <div class="heading-group">
        <span class="date-label" id="today-label"></span>
        <span class="title">ニュース</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="refresh-btn" aria-label="更新" title="更新">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
        </button>
      </div>
    </header>
    <nav class="category-row" id="category-row"></nav>
    <div class="pull-indicator" id="pull-indicator">引っぱって更新</div>
    <div class="news-scroll" id="news-scroll">
      <div id="news-list"></div>
    </div>
    <nav class="bottom-tabs">
      <button class="tab-item active" data-tab="news">
        <span class="dot"></span><span class="label">ホーム</span>
      </button>
      <button class="tab-item" data-tab="settings">
        <span class="dot"></span><span class="label">設定</span>
      </button>
    </nav>
  </section>

  <!-- 記事詳細 -->
  <section class="view" id="view-article">
    <div class="nav-bar">
      <button class="back-btn" id="back-btn"><span class="chevron">‹</span>ニュース</button>
    </div>
    <div class="article-scroll" id="article-scroll">
      <img class="hero-img" id="article-hero" alt="">
      <div class="article-body">
        <span class="article-category" id="article-category"></span>
        <h1 class="article-title" id="article-title"></h1>
        <div class="article-meta" id="article-meta"></div>
        <div class="article-content" id="article-content"></div>
        <div class="summary-note">
          この内容は配信元RSSによる要約です。全文は「元記事を読む」からご確認ください。
        </div>
        <a class="pill-btn primary summary-cta" id="open-original-btn-inline" target="_blank" rel="noopener">元記事の全文を読む ›</a>
      </div>
    </div>
    <div class="article-actions">
      <button class="pill-btn" id="font-size-btn">Aa</button>
      <button class="pill-btn" id="share-btn">シェア</button>
      <a class="pill-btn primary" id="open-original-btn" target="_blank" rel="noopener">元記事を読む</a>
    </div>
    <div class="share-sheet-overlay" id="share-sheet-overlay">
      <div class="share-sheet">
        <span class="grabber"></span>
        <div>
          <div class="share-sheet-title">記事をシェア</div>
          <div class="share-sheet-article" id="share-sheet-article-title"></div>
        </div>
        <div class="share-targets">
          <button class="share-target" data-share="copy"><span class="icon-circle">URL</span><span class="label">リンクをコピー</span></button>
          <button class="share-target" data-share="x"><span class="icon-circle">X</span><span class="label">X</span></button>
          <button class="share-target" data-share="line"><span class="icon-circle">L</span><span class="label">LINE</span></button>
          <button class="share-target" data-share="other"><span class="icon-circle">…</span><span class="label">その他</span></button>
        </div>
        <button class="share-cancel" id="share-cancel-btn">キャンセル</button>
      </div>
    </div>
  </section>

  <!-- 設定 -->
  <section class="view" id="view-settings">
    <header class="settings-header"><span class="title">設定</span></header>
    <div class="settings-scroll">

      <div class="settings-section">
        <div class="settings-section-head">
          <span class="label">ニュースソース</span>
          <span class="meta" id="feed-count-label"></span>
        </div>
        <div class="settings-group" id="feed-list"></div>
      </div>

      <div class="settings-section">
        <span class="label" style="padding:0 4px">カスタムソースを追加</span>
        <div class="type-select-row">
          <select class="type-select" id="source-type-select">
            <option value="rss">RSS / Atom</option>
            <option value="json_feed">JSON Feed</option>
            <option value="api">ニュースAPI (NewsAPI)</option>
          </select>
        </div>
        <div class="add-feed-row">
          <input class="text-input" id="feed-url-input" placeholder="https://example.com/feed.xml">
          <button class="add-btn" id="add-feed-btn">追加</button>
        </div>
        <span class="hint-text" id="add-feed-hint">RSS / Atom / JSON Feed の URL、または NewsAPI を選んでください</span>
      </div>

      <div class="settings-section" id="newsapi-key-section" style="display:none">
        <span class="label" style="padding:0 4px">NewsAPI キー</span>
        <div class="add-feed-row">
          <input class="text-input" id="newsapi-key-input" placeholder="NewsAPI の API キーを入力">
          <button class="add-btn" id="save-newsapi-key-btn">保存</button>
        </div>
        <span class="hint-text">newsapi.org で取得したキーを入力してください(未設定の場合、NewsAPIソースは取得されません)</span>
      </div>

      <div class="settings-section">
        <span class="label" style="padding:0 4px">取得とキャッシュ</span>
        <div class="settings-group">
          <div class="settings-row">
            <span class="row-label">自動取得</span>
            <div class="select-wrap">
              <select id="interval-select">
                <option value="off">オフ</option>
                <option value="daily7">毎朝7時</option>
                <option value="3h">3時間ごと</option>
                <option value="1d">1日1回</option>
              </select>
            </div>
          </div>
          <div class="settings-row">
            <span class="row-label">キャッシュ保持期間</span>
            <div class="select-wrap">
              <select id="cache-days-select">
                <option value="1">1日間</option>
                <option value="3">3日間</option>
                <option value="7">7日間</option>
                <option value="14">14日間</option>
                <option value="30">30日間</option>
              </select>
            </div>
          </div>
        </div>
        <span class="note-text">期間を過ぎた記事はオフライン保存から削除されます。</span>
      </div>

      <div class="settings-section">
        <span class="label" style="padding:0 4px">文字サイズ(記事本文)</span>
        <div class="font-size-segment" id="font-size-segment">
          <button class="segment-item" data-size="md">標準</button>
          <button class="segment-item" data-size="lg">大</button>
          <button class="segment-item" data-size="xl">特大</button>
        </div>
      </div>

      <div class="settings-section">
        <span class="label" style="padding:0 4px">テーマ</span>
        <div class="theme-segment" id="theme-segment">
          <button class="segment-item" data-theme="light">ライト</button>
          <button class="segment-item" data-theme="dark">ダーク</button>
        </div>
      </div>

    </div>
    <nav class="bottom-tabs">
      <button class="tab-item" data-tab="news">
        <span class="dot"></span><span class="label">ホーム</span>
      </button>
      <button class="tab-item active" data-tab="settings">
        <span class="dot"></span><span class="label">設定</span>
      </button>
    </nav>
  </section>

</div>

<script src="./js/theme.js"></script>
<script src="./js/rssParser.js"></script>
<script src="./js/jsonFeedParser.js"></script>
<script src="./js/newsApiParser.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/sources.js"></script>
<script src="./js/newsList.js"></script>
<script src="./js/articleDetail.js"></script>
<script src="./js/settings.js"></script>
<script src="./js/sync.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
